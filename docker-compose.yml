services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: semantic-db-postgres
    environment:
      POSTGRES_USER: semantic
      POSTGRES_PASSWORD: semantic
      POSTGRES_DB: semantic_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantic -d semantic_db"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
